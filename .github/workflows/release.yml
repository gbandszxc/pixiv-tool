# ============================================================
# pixiv-tool Release Workflow
# 触发条件：push tag v*
# 构建三平台产物并发布 GitHub Release
# ============================================================

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# -------------------------------------------------------------------
# 构建任务：三平台矩阵
# -------------------------------------------------------------------

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: pixiv-tool-windows-x64
            archive_ext: zip
          - os: macos-latest
            artifact_name: pixiv-tool-macos-x64
            archive_ext: zip
          - os: ubuntu-latest
            artifact_name: pixiv-tool-linux-x64
            archive_ext: tar.gz

    steps:
      # --- 检出代码 ---
      - name: Checkout
        uses: actions/checkout@v4

      # --- 环境准备 ---
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install pnpm
        run: npm install -g pnpm

      # --- 依赖安装 ---
      - name: Install Python dependencies
        run: uv sync

      - name: Install frontend dependencies
        run: pnpm install
        working-directory: frontend

      # --- 构建前端 ---
      - name: Build frontend
        run: pnpm build
        working-directory: frontend

      # --- 复制静态资源 ---
      - name: Copy static assets
        run: cp -r frontend/dist backend/static

      # --- PyInstaller 打包 ---
      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Build with PyInstaller
        run: >
          pyinstaller pixiv-tool.spec
          --onedir
          --noconfirm

      # --- 压缩产物 ---
      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/pixiv-tool/* -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Package artifact (macOS/Linux)
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.artifact_name }}.${{ matrix.archive_ext }} -C dist/pixiv-tool .

      # --- 上传 artifact ---
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}

  # -------------------------------------------------------------------
  # 发布任务：汇总产物到 GitHub Release
  # -------------------------------------------------------------------

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/**/*
