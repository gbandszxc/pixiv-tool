# 发版流水线：手动触发、指定版本号、幂等覆盖、三平台安装包
# 用法：仓库 Actions → Release → Run workflow → 输入版本号（semver，如 1.1.0）
# 产物：Windows x64 + arm64 MSI / macOS universal + aarch64 DMG /
#       Linux x64 AppImage + deb + rpm / Linux arm64 deb + rpm
# Release 正文：docs/releases/<版本>.md（存在则作为更新说明）＋ 按实际产物生成的安装包表格
# 幂等：同版本号重复执行会先删除旧 v<版本> Release 与 Tag，再重建并覆盖产物
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（semver，如 1.1.0）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ github.event.inputs.version }}

jobs:
  validate:
    name: 校验版本号
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: semver 校验（不合法直接失败，避免白跑 40 分钟构建）
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::版本号不合法：'$VERSION'（期望 semver，如 1.1.0）"
            exit 1
          fi
          echo "本次发布：v$VERSION"

  build:
    name: 构建（${{ matrix.id }}）
    needs: validate
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64-msi
            os: windows-latest
            wcpu: x64
            rust_targets: ''
            tauri_target: ''
            bundles: msi
          # Windows arm64 用 GitHub 原生 arm64 runner（不交叉编译）
          - id: windows-arm64-msi
            os: windows-11-arm
            wcpu: arm64
            rust_targets: ''
            tauri_target: ''
            bundles: msi
          - id: macos-universal-dmg
            os: macos-latest
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            tauri_target: universal-apple-darwin
            bundles: dmg
          - id: macos-aarch64-dmg
            os: macos-latest
            rust_targets: 'aarch64-apple-darwin'
            tauri_target: aarch64-apple-darwin
            bundles: dmg
          # Linux 基线取 22.04（官方推荐的 WebKitGTK 4.1 最老基线，保证 glibc 下限）
          - id: linux-x64
            os: ubuntu-22.04
            rust_targets: ''
            tauri_target: ''
            bundles: appimage,deb,rpm
          # arm64 用 GitHub 原生 arm64 runner 原生编译（不走交叉编译）；
          # AppImage 的 linuxdeploy 在 arm64 上缺可靠支持，因此 arm64 只出 deb/rpm
          - id: linux-arm64
            os: ubuntu-22.04-arm
            rust_targets: ''
            tauri_target: ''
            bundles: deb,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.id }}

      - name: 安装 Linux 系统依赖（webkit2gtk-4.1 / libclang / rpm 等）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libclang-dev cmake rpm
          # BoringSSL 在部分平台需要 go 生成汇编；arm64 镜像不保证预装
          command -v go >/dev/null 2>&1 || sudo apt-get install -y golang-go

      - name: 安装 NASM（windows-2025-vs2026 镜像未预装，BoringSSL 汇编需要）
        if: runner.os == 'Windows'
        run: choco install nasm -y --no-progress

      - name: 安装前端依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: 写入版本号（tauri.conf.json + Cargo.toml，仅本次构建，不回写仓库）
        shell: bash
        run: |
          python3 - <<'EOF'
          import json, re, os
          v = os.environ["VERSION"]
          p = "src-tauri/tauri.conf.json"
          with open(p, encoding="utf-8") as f:
              c = json.load(f)
          c["version"] = v
          with open(p, "w", encoding="utf-8") as f:
              f.write(json.dumps(c, indent=2) + "\n")
          p = "src-tauri/Cargo.toml"
          with open(p, encoding="utf-8") as f:
              t = f.read()
          t = re.sub(r'(?m)^version = ".*?"', f'version = "{v}"', t, count=1)
          with open(p, "w", encoding="utf-8") as f:
              f.write(t)
          EOF
          grep '"version"' src-tauri/tauri.conf.json
          grep -m1 '^version' src-tauri/Cargo.toml

      - name: 前端构建（类型检查 + vite build）
        shell: bash
        run: pnpm -C frontend build

      - name: tauri build
        shell: bash
        run: |
          # tauri-cli 从 CWD 向下探测 src-tauri（不会找平级目录），必须从仓库根调用
          # frontend/ 下的本地 CLI；beforeBuildCommand 由上一步显式完成，这里清空
          if [ "$RUNNER_OS" = "Windows" ]; then
            WCPU="${{ matrix.wcpu }}"
            export LIBCLANG_PATH="C:\Program Files\LLVM\bin"
            [ -f "/c/Program Files/LLVM/bin/libclang.dll" ] || { echo "::error::未找到 libclang.dll（btls-sys bindgen 需要）"; exit 1; }
            # btls-sys 的 cmake 用 Ninja 生成器 + vswhere 动态发现 VS 路径导入 MSVC 环境
            export CMAKE_GENERATOR="Ninja"
            command -v go >/dev/null 2>&1 || { echo "::error::Go 不可用（BoringSSL 需要）"; exit 1; }
            if [ "$WCPU" = "arm64" ]; then
              # 原生 arm64：BoringSSL 的 win-aarch64 汇编是 GNU 汇编器语法，上游要求用
              # Clang 汇编，此处 CMake 只会选到 MSVC 的 armasm64（汇编不了这些文件）。
              # btls-sys 自身只在 Windows 交叉编译时关汇编，原生构建不会关，故经它的
              # 工具链文件入口显式关闭（走 C 实现；TLS 少了 ARMv8 汇编加速，对本应用
              # 网络 I/O 为主的负载无实质影响）。arm64 不需要 NASM（那是 x86 汇编器）。
              VCREQ="Microsoft.VisualStudio.Component.VC.Tools.ARM64"
              TOOLCHAIN="$GITHUB_WORKSPACE/src-tauri/cmake/btls-windows-arm64.cmake"
              [ -f "$TOOLCHAIN" ] || { echo "::error::缺少 BoringSSL 工具链文件 $TOOLCHAIN"; exit 1; }
              export CMAKE_TOOLCHAIN_FILE_aarch64_pc_windows_msvc="$TOOLCHAIN"
            else
              # x64：BoringSSL 走 NASM 汇编；windows-latest 已切到 windows-2025-vs2026
              # 镜像（VS2026，无 VS2022 实例、未预装 NASM）
              VCREQ="Microsoft.VisualStudio.Component.VC.Tools.x86.x64"
              export PATH="/c/Program Files/NASM:$PATH"
              command -v nasm >/dev/null 2>&1 || { echo "::error::NASM 不可用"; exit 1; }
            fi
            VSWHERE="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
            [ -f "$VSWHERE" ] || { echo "::error::未找到 vswhere"; exit 1; }
            VSPATH=$("$VSWHERE" -latest -products '*' -requires "$VCREQ" -property installationPath | tr -d '\r' | head -1)
            [ -n "$VSPATH" ] || VSPATH=$("$VSWHERE" -latest -products '*' -property installationPath | tr -d '\r' | head -1)
            echo "VS 安装路径: $VSPATH"
            [ -n "$VSPATH" ] || { echo "::error::vswhere 未找到 MSVC 工具链"; exit 1; }
            # 引号无法穿越 MSYS→cmd 参数边界（\" 会被 cmd 当成字面量），改为生成
            # 临时批处理执行，引号写在文件内容里由 cmd 原生解析
            if [ "$WCPU" = "arm64" ]; then
              printf '@echo off\r\ncall "%s\\VC\\Auxiliary\\Build\\vcvarsall.bat" arm64\r\nset\r\n' "$VSPATH" > import_msvc.cmd
            else
              printf '@echo off\r\ncall "%s\\VC\\Auxiliary\\Build\\vcvars64.bat"\r\nset\r\n' "$VSPATH" > import_msvc.cmd
            fi
            cmd //c import_msvc.cmd > msvc_env.raw 2> msvc_env.err || {
              echo "::error::vcvars 调用失败"; tail -20 msvc_env.err; exit 1;
            }
            if ! grep -aq '^INCLUDE=' msvc_env.raw; then
              echo "::error::vcvars 未生成 INCLUDE（MSVC 环境不完整）"; tail -5 msvc_env.err; exit 1
            fi
            # 导出为单引号字面量（Windows 环境值可能以反斜杠结尾，双引号会被转义
            # 吞掉收尾引号）；INCLUDE/LIB 保持 Windows 格式供 cl.exe 使用
            grep -aE '^[A-Za-z_][A-Za-z0-9_]*=' msvc_env.raw | grep -av '^PATH=' \
              | awk -F= '{ v=substr($0, length($1)+2); sub(/\r$/, "", v); gsub(/\047/, "\047\\\\\047\047", v); printf "export %s=\047%s\047\n", $1, v }' \
              > msvc_exports.sh
            source msvc_exports.sh
            # PATH 单独转成 MSYS 冒号格式（分号格式 bash 无法用于命令查找）
            WINPATH=$(grep -a '^PATH=' msvc_env.raw | head -1 | cut -d= -f2- | tr -d '\r')
            export PATH="$(printf '%s' "$WINPATH" | tr ';' '\n' | sed '/^$/d' | cygpath -u -f - | paste -sd: -):$PATH"
            command -v cl.exe >/dev/null 2>&1 || { echo "::error::MSVC 环境导入失败（cl.exe 不在 PATH）"; exit 1; }
            cl.exe 2>&1 | head -1 || true
          fi
          args=(--bundles "${{ matrix.bundles }}" --config '{"build":{"beforeBuildCommand":""}}')
          [ -n "${{ matrix.tauri_target }}" ] && args+=(--target "${{ matrix.tauri_target }}")
          frontend/node_modules/.bin/tauri build "${args[@]}"

      - name: 收集安装包
        shell: bash
        run: |
          mkdir -p dist
          find src-tauri/target -path '*/bundle/*' -type f \
            \( -name '*.msi' -o -name '*.dmg' -o -name '*.AppImage' \
               -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp -v {} dist/ \;
          [ -n "$(ls -A dist)" ] || { echo "::error::未找到任何安装包产物"; exit 1; }
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: 发布 Release（幂等覆盖）
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 覆盖式发布 v${{ env.VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          BASE="${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG"
          # 幂等：先删同名 Release（连带 Tag），同版本号重复执行即整体覆盖
          gh release delete "$TAG" --yes --cleanup-tag || true
          git push origin ":refs/tags/$TAG" || true
          sleep 3
          ls -la dist/

          BODY="release-body.md"
          if [ -f "docs/releases/$VERSION.md" ]; then
            cat "docs/releases/$VERSION.md" > "$BODY"
          else
            : > "$BODY"
          fi

          # 先建 Release（正文暂只有更新说明），再读回平台实际存储的资产名补表格：
          # GitHub 会规整上传的资产名（如空格换成 .），照 runner 上的文件名拼链接会
          # 得到带空格/失效的 URL，因此链接一律以发布后的资产名为准
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Pixiv Tool v$VERSION" \
            --notes-file "$BODY" \
            dist/*
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')

          link() { # link <资产名匹配子串> <链接文字>
            local f
            f=$(printf '%s\n' "$ASSETS" | grep -F -- "$1" | head -1 || true)
            if [ -n "$f" ]; then
              printf '[%s](%s/%s)' "$2" "$BASE" "$(printf '%s' "$f" | sed 's/ /%20/g')"
            else
              printf '—'
            fi
          }

          {
            cat "$BODY"
            echo
            echo "## 安装包"
            echo
            echo "| 架构 | Windows | macOS | Linux |"
            echo "| --- | --- | --- | --- |"
            printf '| x86-64 (64-bit) | %s | %s | %s · %s · %s |\n' \
              "$(link '_x64_' MSI)" \
              "$(link 'universal.dmg' '通用 DMG')" \
              "$(link '.AppImage' AppImage)" \
              "$(link '_amd64.deb' deb)" \
              "$(link 'x86_64.rpm' rpm)"
            printf '| ARM64 | %s | %s | %s · %s |\n' \
              "$(link '_arm64_' MSI)" \
              "$(link 'aarch64.dmg' DMG)" \
              "$(link '_arm64.deb' deb)" \
              "$(link 'aarch64.rpm' rpm)"
            echo
            echo "macOS 通用 DMG 同时支持 Intel 与 Apple Silicon（Intel 机器用它即可），ARM64 一行另给 Apple Silicon 专用包。"
            echo
            echo "安装包未做代码签名：macOS 首次打开需右键 → 打开；Windows SmartScreen 提示属正常现象。"
          } > release-notes.md

          cat release-notes.md
          # 缺某种格式时对应单元格显示 —，不会产生死链
          gh release edit "$TAG" --notes-file release-notes.md
