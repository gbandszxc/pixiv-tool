# 发版流水线：手动触发、指定版本号、幂等覆盖、三平台安装包
# 用法：仓库 Actions → Release → Run workflow → 输入版本号（semver，如 1.0.0）
# 产物：Windows x64 MSI / macOS universal + aarch64 DMG / Linux x64 AppImage
# 幂等：同版本号重复执行会先删除旧 v<版本> Release 与 Tag，再重建并覆盖产物
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（semver，如 1.0.0）'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: ${{ github.event.inputs.version }}

jobs:
  validate:
    name: 校验版本号
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: semver 校验（不合法直接失败，避免白跑 40 分钟构建）
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::版本号不合法：'$VERSION'（期望 semver，如 1.0.0）"
            exit 1
          fi
          echo "本次发布：v$VERSION"

  build:
    name: 构建（${{ matrix.id }}）
    needs: validate
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64-msi
            os: windows-latest
            rust_targets: ''
            tauri_target: ''
            bundles: msi
          - id: macos-universal-dmg
            os: macos-latest
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            tauri_target: universal-apple-darwin
            bundles: dmg
          - id: macos-aarch64-dmg
            os: macos-latest
            rust_targets: 'aarch64-apple-darwin'
            tauri_target: aarch64-apple-darwin
            bundles: dmg
          - id: linux-x64-appimage
            os: ubuntu-22.04
            rust_targets: ''
            tauri_target: ''
            bundles: appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.id }}

      - name: 安装 Linux 系统依赖（webkit2gtk-4.1 / libclang 等）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libclang-dev

      - name: 安装 NASM（windows-2025-vs2026 镜像未预装，BoringSSL 汇编需要）
        if: runner.os == 'Windows'
        run: choco install nasm -y --no-progress

      - name: 安装前端依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: 写入版本号（tauri.conf.json + Cargo.toml，仅本次构建，不回写仓库）
        shell: bash
        run: |
          python3 - <<'EOF'
          import json, re, os
          v = os.environ["VERSION"]
          p = "src-tauri/tauri.conf.json"
          with open(p, encoding="utf-8") as f:
              c = json.load(f)
          c["version"] = v
          with open(p, "w", encoding="utf-8") as f:
              f.write(json.dumps(c, indent=2) + "\n")
          p = "src-tauri/Cargo.toml"
          with open(p, encoding="utf-8") as f:
              t = f.read()
          t = re.sub(r'(?m)^version = ".*?"', f'version = "{v}"', t, count=1)
          with open(p, "w", encoding="utf-8") as f:
              f.write(t)
          EOF
          grep '"version"' src-tauri/tauri.conf.json
          grep -m1 '^version' src-tauri/Cargo.toml

      - name: 前端构建（类型检查 + vite build）
        shell: bash
        run: pnpm -C frontend build

      - name: tauri build
        shell: bash
        run: |
          # tauri-cli 从 CWD 向下探测 src-tauri（不会找平级目录），必须从仓库根调用
          # frontend/ 下的本地 CLI；beforeBuildCommand 由上一步显式完成，这里清空
          if [ "$RUNNER_OS" = "Windows" ]; then
            export LIBCLANG_PATH="C:\Program Files\LLVM\bin"
            # windows-latest 已切到 windows-2025-vs2026 镜像（VS2026，无 VS2022 实例、
            # 未预装 NASM）。btls-sys 的 cmake 用 Ninja 生成器 + vswhere 动态发现
            # VS 路径导入 MSVC 环境；BoringSSL 另需 NASM（汇编）与 Go（镜像已带 Go）
            export CMAKE_GENERATOR="Ninja"
            export PATH="/c/Program Files/NASM:$PATH"
            command -v nasm >/dev/null 2>&1 || { echo "::error::NASM 不可用"; exit 1; }
            command -v go >/dev/null 2>&1 || { echo "::error::Go 不可用（BoringSSL 需要）"; exit 1; }
            VSWHERE="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
            [ -f "$VSWHERE" ] || { echo "::error::未找到 vswhere"; exit 1; }
            VSPATH=$("$VSWHERE" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | tr -d '\r' | head -1)
            [ -n "$VSPATH" ] || VSPATH=$("$VSWHERE" -latest -products '*' -property installationPath | tr -d '\r' | head -1)
            echo "VS 安装路径: $VSPATH"
            [ -n "$VSPATH" ] || { echo "::error::vswhere 未找到 MSVC 工具链"; exit 1; }
            VCVARS_WIN="${VSPATH}\\VC\\Auxiliary\\Build\\vcvars64.bat"
            # vcvars 后的全量环境落到文件再转 bash export；失败时输出 stderr 便于诊断
            cmd //c "call \"$VCVARS_WIN\" && set" > msvc_env.raw 2> msvc_env.err || {
              echo "::error::vcvars64.bat 调用失败"; tail -20 msvc_env.err; exit 1;
            }
            eval "$(grep -aE '^[A-Za-z_][A-Za-z0-9_]*=' msvc_env.raw \
              | awk -F= '{ printf "export %s=\"%s\"\n", $1, substr($0, length($1)+2) }')"
            # INCLUDE/LIB 保持 Windows 格式供 cl.exe 使用；PATH 单独转成 MSYS 冒号格式
            WINPATH=$(grep -a '^PATH=' msvc_env.raw | head -1 | cut -d= -f2-)
            export PATH="$(printf '%s' "$WINPATH" | tr ';' '\n' | sed '/^$/d' | cygpath -u -f - | paste -sd: -):$PATH"
            command -v cl.exe >/dev/null 2>&1 || { echo "::error::MSVC 环境导入失败（cl.exe 不在 PATH）"; exit 1; }
            cl.exe 2>&1 | head -1 || true
          fi
          args=(--bundles "${{ matrix.bundles }}" --config '{"build":{"beforeBuildCommand":""}}')
          [ -n "${{ matrix.tauri_target }}" ] && args+=(--target "${{ matrix.tauri_target }}")
          frontend/node_modules/.bin/tauri build "${args[@]}"

      - name: 收集安装包
        shell: bash
        run: |
          mkdir -p dist
          find src-tauri/target -path '*/bundle/*' -type f \
            \( -name '*.msi' -o -name '*.dmg' -o -name '*.AppImage' \) \
            -exec cp -v {} dist/ \;
          [ -n "$(ls -A dist)" ] || { echo "::error::未找到任何安装包产物"; exit 1; }
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: 发布 Release（幂等覆盖）
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 覆盖式发布 v${{ env.VERSION }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          # 幂等：先删同名 Release（连带 Tag），同版本号重复执行即整体覆盖
          gh release delete "$TAG" --yes --cleanup-tag || true
          git push origin ":refs/tags/$TAG" || true
          sleep 3
          ls -la dist/
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Pixiv Tool v$VERSION" \
            --notes "$(printf 'GitHub Actions 自动构建。\n\n- Windows x64：*.msi\n- macOS 通用（Intel + Apple Silicon）：*_universal.dmg\n- macOS Apple Silicon：*_aarch64.dmg\n- Linux x64：*_amd64.AppImage\n\n安装包未做代码签名：macOS 首次打开需右键→打开；Windows SmartScreen 提示属正常现象。')" \
            dist/*
