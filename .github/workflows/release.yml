# ============================================================
# pixiv-tool Release Workflow
# 触发条件：push tag v*（自动）；workflow_dispatch（手动/可选签名）
# 构建三平台产物并发布 GitHub Release
#
# 跨平台依赖组：pyproject.toml 的 [project.optional-dependencies]
#   win    → pywebview(WebView2)      Windows 全功能
#   macos  → pywebview(WebKit)        mac 能构建/启动/浏览，登录不可用(V2 keychain)
#   linux  → pywebview(WebKitGTK)     需机器预装 webkit2gtk(见 README)
#   dev    → pyinstaller              打包工具，不进运行时
# ============================================================

name: Release

on:
  push:
    tags:
      - "v*"
  # 手动触发：便于在配置签名 secrets 后跑一次签名构建而不用发 tag。
  workflow_dispatch:
    inputs:
      enable_macos_sign:
        description: "对 mac 产物做代码签名（需配 MACOS_CERTIFICATE* secrets）"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# -------------------------------------------------------------------
# 构建任务：三平台矩阵
# -------------------------------------------------------------------

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # 把 dispatch input 透传成 job env，让 step 的 if: 能读到（secrets 不能直接进 if）。
    env:
      ENABLE_MACOS_SIGN: ${{ github.event.inputs.enable_macos_sign == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: pixiv-tool-windows-x64
            archive_ext: zip
          - os: macos-latest
            artifact_name: pixiv-tool-macos-x64
            archive_ext: zip
          - os: ubuntu-latest
            artifact_name: pixiv-tool-linux-x64
            archive_ext: tar.gz

    steps:
      # --- 检出代码 ---
      - name: Checkout
        uses: actions/checkout@v4

      # --- 环境准备 ---
      # Python 锁 3.11：requires-python >=3.11，CI 稳定优先（spec 无 3.12/3.13 专有特性）。
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install pnpm
        run: npm install -g pnpm

      # --- 依赖安装 ---
      # 按 runner.os 选对应 platform extra（拉 pywebview），再加 dev extra（拉 pyinstaller）。
      # 合并成一步后无需单独 uv pip install pyinstaller（pyinstaller 在 dev extra 里）。
      - name: Install Python dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then EXTRA="win"
          elif [ "$RUNNER_OS" = "macOS" ]; then EXTRA="macos"
          else EXTRA="linux"
          fi
          uv sync --extra "$EXTRA" --extra dev

      - name: Install frontend dependencies
        run: pnpm install
        working-directory: frontend

      # --- 构建前端 ---
      - name: Build frontend
        run: pnpm build
        working-directory: frontend

      # --- 复制静态资源 ---
      # V2-01 后 backend/ 已重构为 src/pixiv_tool/；datas 源就是 src/pixiv_tool/static。
      # 用 /. 保证拷内容不嵌套；先 mkdir 防首次不存在（仓库默认不提交空 static/）。
      - name: Copy static assets
        run: |
          mkdir -p src/pixiv_tool/static
          cp -r frontend/dist/. src/pixiv_tool/static/

      # --- PyInstaller 打包 ---
      # spec 已通过 COLLECT 声明 onedir，不能再传 --onedir（PyInstaller 6+ 拒绝
      # makespec 选项与 .spec 共用，见 SESSION §8.2）。
      - name: Build with PyInstaller
        run: pyinstaller pixiv-tool.spec --noconfirm

      # --- 代码签名（macOS，可选） ---
      # 默认不跑：需 Apple Developer 证书 + 配 4 个 secrets。
      # 启用方式：手动触发(workflow_dispatch)时勾 enable_macos_sign，并确保 secrets 已配。
      # 注意 GitHub Actions 限制：secrets.* 不能直接出现在 if:，故用上面 job env 的开关判断。
      # 不含 notarize（还需 Apple ID secrets + notarytool 较重，按需再加）。
      - name: Codesign (macOS, optional)
        if: runner.os == 'macOS' && env.ENABLE_MACOS_SIGN == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p build build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k build build.keychain
          codesign --force --deep --options runtime \
            --sign "$MACOS_CERTIFICATE_NAME" "dist/Pixiv Tool.app"

      # --- 压缩产物（全部输出到 dist/ 下） ---
      # Windows：onedir 目录压 zip。
      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        run: cd dist && Compress-Archive -Path pixiv-tool/* -DestinationPath ${{ matrix.artifact_name }}.zip

      # macOS：spec 若声明了 BUNDLE 则产物是 dist/Pixiv Tool.app（注意空格），
      # 必须用 ditto 打包（zip/tar 会破坏 bundle 的权限位/符号链接）；
      # 若 Batch1 未加 BUNDLE 则回退到 onedir 目录（dist/pixiv-tool/）。
      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          if [ -d "Pixiv Tool.app" ]; then
            ditto -c -k --keepParent "Pixiv Tool.app" "${{ matrix.artifact_name }}.zip"
          else
            echo "No .app found (BUNDLE not declared in spec); falling back to onedir dir"
            tar -czf "${{ matrix.artifact_name }}.zip" -C pixiv-tool .
          fi

      # Linux：onedir 目录打 tar.gz（README 注明需预装 webkit2gtk）。
      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        run: cd dist && tar -czf ${{ matrix.artifact_name }}.${{ matrix.archive_ext }} -C pixiv-tool .

      # --- 上传 artifact ---
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.${{ matrix.archive_ext }}

  # -------------------------------------------------------------------
  # 发布任务：汇总产物到 GitHub Release
  # -------------------------------------------------------------------

  release:
    needs: build
    runs-on: ubuntu-latest
    # workflow_dispatch 手动触发时不发 Release（避免误发版）。
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/**/*
