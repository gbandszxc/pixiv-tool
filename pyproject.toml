[project]
name = "pixiv-tool"
version = "0.1.0"
description = "本地运行的 Pixiv 客户端工具，V1 聚焦 Pixiv 小说抓取"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    # curl_cffi:浏览器 TLS 指纹伪装(JA3/JA4 + HTTP/2 + 浏览器 header)。
    # 登录后业务请求之前走裸 httpx,CPython OpenSSL 指纹容易被 Pixiv 风控识别。
    # wheel 自带 libcurl-impersonate 动态库,打包时需 collect_dynamic_libs(见 spec)。
    "curl_cffi>=0.7.0",
    # python-multipart:FastAPI Form() 解析 form data 必需依赖。
    # login_manual 端点用 Form 接收 PHPSESSID(放 body 而非 query,避免 URL 泄露 cookie)。
    "python-multipart>=0.0.9",
    # 真实浏览器登录通过 Chrome DevTools Protocol 读取 HttpOnly Cookie。
    # uvicorn[standard] 也依赖它；这里直接声明，避免依赖传递关系成为隐式契约。
    "websockets>=14.0",
]

# ---------------------------------------------------------------------------
# TODO(V2-02): httpx2 弃用警告跟踪
#
# pytest 运行结束时输出：
#   StarletteDeprecationWarning: Using `httpx` with `starlette.testclient` is
#   deprecated; install `httpx2` instead.
#
# 当前版本组合（2026-07-22 记录，来源 `python -c "import ...; print(...)"`）：
#   fastapi    0.139.2
#   starlette  1.3.1
#   httpx      0.28.1
#
# 不主动迁移：httpx2 是 httpx 的异步分支，API 与 httpx 不完全兼容，
# 直接替换会破坏现有 TestClient 用法。等 fastapi/starlette 下一个主版本
# 升级时，重新评估 httpx2 成熟度，再统一迁移 tests/ 下的 TestClient 用法。
# 跟踪 ticket：.scratch/pixiv-tool-v2/issues/02-frontend-tech-debt.md §子项3
# ---------------------------------------------------------------------------

[project.optional-dependencies]
# pywebview 平台后端按平台拉不同原生依赖:Windows 拉 pythonnet(WebView2),
# macOS/Linux 拉 PyObjC / GTK。pywebview 在各平台声明即可,依赖会自动解析
# (pip/uv 装 pywebview 会自动带 pyobjc-framework-Cocoa 等子依赖)。
# 不要手动加 pyobjc——由 pywebview 自己拉,版本冲突时再单独锁。
win = ["pywebview>=5.0,<6.0"]
macos = ["pywebview>=5.0,<6.0", "keyring>=25.0,<26.0"]
linux = ["pywebview>=5.0,<6.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pyinstaller>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixiv_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
