[project]
name = "pixiv-tool"
version = "0.1.0"
description = "本地运行的 Pixiv 客户端工具，V1 聚焦 Pixiv 小说抓取"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
win = ["pywebview>=5.0,<6.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pyinstaller>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixiv_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
