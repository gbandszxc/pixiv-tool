[package]
name = "pixiv-tool"
version = "1.0.0"
description = "Pixiv Tool —— 本地 Pixiv 小说/插画抓取工具（Tauri 2 桌面应用）"
authors = ["pixiv-tool"]
license = "MIT"
edition = "2024"
rust-version = "1.85"

# lib 名固定 pixiv_tool_lib：main.rs 只做薄壳，业务全在 lib 里（方便测试与后续移动端壳复用）
[lib]
name = "pixiv_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pixiv-tool"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["unstable"] }
# 打开外链（浏览页「在浏览器中打开」）：系统默认浏览器，不经内嵌 webview。
# 锁 2.5：2.6+ 声明 rust-version 1.90，与包内 rust-version 1.85 冲突；且 npm 侧
# @tauri-apps/plugin-opener 必须与之同 major.minor，两侧一起升才动这里。
tauri-plugin-opener = "2.5"
tauri-plugin-dialog = "2.7"
tauri-plugin-log = "2.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
bytes = "1.12"
uuid = { version = "1", features = ["v4"] }
# keyring 3：平台凭据存储全部要显式开启 feature（keyring 3 无默认后端）。
# linux-native-sync-persistent = linux-keyutils + Secret Service（dbus），crypto-rust 免系统 openssl。
keyring = { version = "3.6", features = [
    "apple-native",
    "windows-native",
    "linux-native-sync-persistent",
    "crypto-rust",
] }
# wreq/wreq-util 版本精确锁定：spike 已验证该组合通过 pixiv 风控；
# wreq-util < 3.0.0-rc.12 是 GPL 不能用。升级前必须重新验证风控。
wreq = "=6.0.0-rc.31"
wreq-util = "=3.0.0-rc.14"
# CDP WebSocket（ws://127.0.0.1 本机调试端口，无需 TLS feature）
tokio-tungstenite = "0.28"
futures-util = "0.3"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
anyhow = "1.0"
log = "0.4"
rand = "0.9"

[target.'cfg(windows)'.dependencies]
# Alt 唤出菜单栏走 WebView2 的 AcceleratorKeyPressed 事件；
# `PlatformWebview::controller()` 的返回类型来自此 crate。
webview2-com = "=0.38.2"
# 菜单栏隐藏 / 收回（src/menu_bar.rs）：SetWindowSubclass、SetMenu/DrawMenuBar、
# PostMessageW。与 Tauri 内部同为 windows 0.61 系列。
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
